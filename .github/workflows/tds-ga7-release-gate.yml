name: TDS GA7 Release Gate

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: "TDS identity: 25ds3000071@ds.study.iitm.ac.in"
        run: |
          echo "TDS identity: 25ds3000071@ds.study.iitm.ac.in"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run release-gate policy tests
        run: npm test
